        }

        .tab-btn.active .tab-counter {

            opacity: 1;
        }

        .tab-counter.zero {

            opacity: 0.4;
        }

            opacity: 0.4;

        }
        .movie-title-kinopoisk {

            padding: 10px;

        }
        .loading {
            color: #fffaffff;
            font-size: 1.2em;

        }
        .empty-state {

        .list-btn {

            color: #fffaffff;

        .tab-btn {

            align-items: center;
            z-index: 1000;

        }

        .scroll-to-top:hover {
            transform: scale(1.1);
        }

        .scroll-to-top:active {
            transform: scale(0.95);

        .delete-btn:disabled {

            cursor: not-allowed !important;

        }

        .delete-btn:disabled:hover {
            background: #666 !important;

        .source-selector {

        .source-option {

            font-family: Nunito;

            background-repeat: no-repeat;

            background-size: 16px;
        }

        .genre-selector select option {
            background: #1a1a1aff;
            color: #fffaffff;
        }

        .source-label {
            color: #b3b3b3ff;
            font-size: 0.8em;
            text-align: center;
            margin-bottom: 5px;
            font-family: Nunito;

        @media (max-width: 600px) {

            }

            .action-btn {
                padding: 12px 24px;
                border: none;
                border-radius: 10px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                display: flex !important;
                flex-wrap: nowrap !important;
                white-space: nowrap !important;
                align-items: center;
                justify-content: center;
                gap: 8px;
                transition: all 0.3s ease;
                text-decoration: none;
            }
            .postpone-btn {
                background: none;
                color: white;
                border: solid 1px gray;
                font-weight: 200;
                font-family: Nunito;
                padding: 12px 22px;
                border-radius: 50px;
                opacity: 0.6;
                font-size: 0.9em;
                cursor: pointer;
                margin-top: 2px;
                transition: all 0.3s ease;
            }
            .source-option {
                padding: 6px 16px;
                font-size: 0.8em;
            }
        }        
    </style>
</head>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOvoLXDIDZ2vVIqHLG8utXYA07yiheTkI",
            authDomain: "cineroll-54934.firebaseapp.com",
            projectId: "cineroll-54934",
            storageBucket: "cineroll-54934.firebasestorage.app",
            messagingSenderId: "158307828214",
            appId: "1:158307828214:web:6d8ed57b6d79ed80e247d7"
        };

        // ВАШ API КЛЮЧ КИНОПОИСКА
        const KINOPOISK_API_KEY = 'f0df9308-4cdb-4195-87c0-42f406c36210';

        // Функция для определения цвета рейтинга
        function getRatingColor(rating) {
        const numRating = parseFloat(rating);
        if (isNaN(numRating)) return '#b3b3b3ff'; // Если рейтинг не число - серый
    
        if (numRating < 4.5) return '#dc3545';     // Красный
        if (numRating < 6.9) return '#b3b3b3ff';   // Серый (используем существующий цвет)
        if (numRating < 8) return '#75a744ff';     // Зелёный
        return '#75a744ff';                         // 8+ тоже зелёный
        }

        let db = null;
        let currentRandomMovie = null;
        let lastRandomMovieId = null;
        let activeMoviesCache = [];
        let availableMoviesCache = [];
        let currentSource = 'list';

        function initFirebase() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                console.log("Firebase подключен");
                return true;
            } catch (error) {
                console.error("Ошибка Firebase:", error);
                return false;
            }
        }

        // ПРАВИЛЬНАЯ ФУНКЦИЯ С API КЛЮЧОМ
        async function getRandomFromKinopoisk(genre = '') {
            try {
                // Генерируем случайный год и страницу
                const randomYear = Math.floor(Math.random() * (2024 - 1950 + 1)) + 1950;
                const randomPage = Math.floor(Math.random() * 10) + 1;
                
                // Формируем ключевое слово для поиска
                let keyword = 'фильм';
                if (genre) {
                    keyword = genre;
                }
                
                // Добавляем год для разнообразия
                const searchKeyword = `${keyword} ${randomYear}`;
                
                const url = `https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(searchKeyword)}&page=${randomPage}`;
                
                console.log('Запрос к API Кинопоиска:', url);
                
                const response = await fetch(url, {
                    headers: {
                        'X-API-KEY': KINOPOISK_API_KEY,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('Неверный API ключ. Проверьте ключ на сайте kinopoiskapiunofficial.tech');
                    }
                    throw new Error(`API ошибка: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Проверяем, есть ли фильмы
                if (!data.films || data.films.length === 0) {
                    // Если ничего не нашли, пробуем без года
                    if (genre) {
                        console.log('Поиск с годом не дал результатов, пробуем без года');
                        const fallbackUrl = `https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(genre)}&page=${randomPage}`;
                        const fallbackResponse = await fetch(fallbackUrl, {
                            headers: {
                                'X-API-KEY': KINOPOISK_API_KEY,
                                'Content-Type': 'application/json'
                            }
                        });
                        if (fallbackResponse.ok) {
                            const fallbackData = await fallbackResponse.json();
                            if (fallbackData.films && fallbackData.films.length > 0) {
                                const film = fallbackData.films[Math.floor(Math.random() * fallbackData.films.length)];
                                return formatFilmData(film);
                            }
                        }
                    }
                    throw new Error('Фильмы не найдены');
                }
                
                // Выбираем случайный фильм из списка
                const randomIndex = Math.floor(Math.random() * data.films.length);
                const film = data.films[randomIndex];
                
                return formatFilmData(film);
                
            } catch (error) {
                console.error('Ошибка получения фильма из Кинопоиска:', error);
                return null;
            }
        }

        function formatFilmData(film) {
            const title = film.nameRu || film.nameEn || film.nameOriginal || 'Без названия';
            const kinopoiskUrl = `https://www.kinopoisk.ru/index.php?kp_query=${encodeURIComponent(title)}`;
            const vkSearchUrl = `https://vk.com/video?q=${encodeURIComponent(title + ' фильм')}&section=search`;

            // Получаем страну из данных
            let country = 'Не указана';
            if (film.countries && film.countries.length > 0) {
                country = film.countries.map(c => c.country).join(', ');
            }
            
            return {
                id: film.filmId || Math.random().toString(36).substr(2, 9),
                title: title,
                year: film.year || 'N/A',
                rating: film.rating || 'Нет рейтинга',
                country: country,
                genres: film.genres?.map(g => g.genre).join(', ') || 'Не указаны',
                description: film.description || 'Описание отсутствует',
                poster: film.posterUrl || film.posterUrlPreview || '',
                kinopoiskUrl: kinopoiskUrl,
                vkSearchUrl: vkSearchUrl,
                fromKinopoisk: true
            };
        }

        async function getRandomMovie() {
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');
            
            loading.style.display = 'block';
            resultDiv.innerHTML = '';
            
            try {
                if (currentSource === 'kinopoisk') {
                    const genre = document.getElementById('genreSelect').value;
                    const movie = await getRandomFromKinopoisk(genre);
                    
                    if (movie) {
                        displayKinopoiskMovie(movie);
                    } else {
                        resultDiv.innerHTML = `
                            <div style="color: #ff6b6b; padding: 30px;">
                                <h3 style="color: #ff6b6b;">Не удалось найти фильм</h3>
                                <p style="color: #b3b3b3ff;">Попробуйте выбрать другой жанр или повторить запрос</p>
                                <button onclick="getRandomMovie()" style="margin-top: 15px; padding: 10px 30px; border-radius: 50px; border: none; background: #75a744ff; color: #1a1a1aff; font-family: Nunito; font-weight: 700; cursor: pointer;">
                                    Попробовать снова
                                </button>
                            </div>
                        `;
                    }
                } else {
                    await getRandomFromList();
                }
            } catch (error) {
                console.error("Ошибка получения фильма:", error);
                resultDiv.innerHTML = `
                    <div style="color: #dc3545; text-align: center; padding: 20px;">
                        <h3>Ошибка</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            } finally {
                loading.style.display = 'none';
            }
        }

        function displayKinopoiskMovie(movie) {
            const resultDiv = document.getElementById('result');
            
            let posterHtml = movie.poster ? 
                `<img src="${movie.poster}" style="max-width: 120px; border-radius: 8px; margin-bottom: 10px; margin-top: 10px;">` : '';

            // Формируем строку с годом, страной и рейтингом
            let infoParts = [];
            if (movie.country && movie.country !== 'Не указана') infoParts.push(movie.country);
            if (movie.year && movie.year !== 'N/A') infoParts.push(movie.year);
    
            // Рейтинг обрабатываем отдельно с цветом
            let ratingHtml = '';
            if (movie.rating && movie.rating !== 'Нет рейтинга') {
            const ratingColor = getRatingColor(movie.rating);
            ratingHtml = `<span style="color: ${ratingColor}; font-weight: 900;">${movie.rating}</span>`;
            infoParts.push(`Рейтинг: ${ratingHtml}`);
            }
    
    const infoString = infoParts.join(' | ');
            
            resultDiv.innerHTML = `
                <div style="animation: fadeIn 0.5s;">
                    ${posterHtml}
                    <div style="font-family: Nunito; font-weight: 900; font-size: 2.2em;" class="movie-title-kinopoisk">${movie.title}</div>
                    <div style="font-size: 0.9em; color: #b3b3b3ff; margin-bottom: 5px;">${infoString}</div>
                    <div style="font-size: 0.8em; color: #b3b3b3ff; margin-bottom: 10px;">${movie.genres}</div>
                    <details style="font-size: 0.9em; color: #ddd; margin-bottom: 15px; padding: 0 10px;">
                    <summary style="font-size: 0.9em; color: #ddd; margin-bottom: 15px; padding: 0 10px;"></summary>
                    <div style="font-size: 0.9em; color: #ddd; margin-bottom: 15px; padding: 0 10px;">${movie.description}</div>
                    </details>
                    <div class="action-buttons">
                        <button 
                           onclick="window.open('${movie.kinopoiskUrl}', '_blank')"
                           style="padding: 12px 22px; border-radius: 50px; font-family: 'Nunito', sans-serif; font-weight: 900; border: none; background: #dc3545; font-size: 16px; color: white; cursor: pointer; margin: 2px;">
                            КиноПоиск
                        </button>
                        <button 
                           onclick="window.open('${movie.vkSearchUrl}', '_blank')"
                           style="padding: 12px 22px; border-radius: 50px; font-family: 'Nunito', sans-serif; font-weight: 900; border: none; background: #4e8387ff; font-size: 16px; color: white; cursor: pointer; margin: 2px;">
                            VK
                        </button>
                    </div>
                </div>
            `;
        }

        async function updateCounters() {
            if (!db) return;
            
            try {
                const snapshot = await db.collection('movies').get();
                
                let activeCount = 0;
                let postponedCount = 0;
                
                snapshot.forEach(doc => {
                    const movieData = doc.data();
                    if (movieData.isActive === false) {
                        postponedCount++;
                    } else {
                        activeCount++;
                    }
                });
                
                const activeCounter = document.getElementById('active-counter');
                const postponedCounter = document.getElementById('postponed-counter');
                
                activeCounter.textContent = activeCount;
                postponedCounter.textContent = postponedCount;
                
                if (activeCount === 0) {
                    activeCounter.classList.add('zero');
                } else {
                    activeCounter.classList.remove('zero');
                }
                
                if (postponedCount === 0) {
                    postponedCounter.classList.add('zero');
                } else {
                    postponedCounter.classList.remove('zero');
                }
                
                console.log(`Счетчики обновлены: активные=${activeCount}, отложенные=${postponedCount}`);
                
            } catch (error) {
                console.error("Ошибка обновления счетчиков:", error);
            }
        }

        async function watchMovie(movieId, movieTitle, platform, url) {
            if (!db) return;
            
            if (confirm(`Открыть ${platform === 'kinopoisk' ? 'КиноПоиск' : 'VK'} и удалить фильм "${movieTitle}" из списка?`)) {
                try {
                    const newWindow = window.open(url, '_blank');
                    
                    if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
                        alert("Всплывающие окна заблокированы. Разрешите всплывающие окна для этого сайта в настройках Safari.");
                        if (confirm("Хотите скопировать ссылку для поиска?")) {
                            navigator.clipboard.writeText(url);
                            alert("Ссылка скопирована в буфер обмена!");
                        }
                    }
                    
                    setTimeout(async () => {
                        try {
                            await db.collection('movies').doc(movieId).delete();
                            
                            const postponedSnapshot = await db.collection('postponedMovies')
                                .where('movieId', '==', movieId)
                                .get();
                            
                            if (!postponedSnapshot.empty) {
                                const deletePromises = [];
                                postponedSnapshot.forEach(doc => {
                                    deletePromises.push(db.collection('postponedMovies').doc(doc.id).delete());
                                });
                                await Promise.all(deletePromises);
                            }
                            
                            activeMoviesCache = activeMoviesCache.filter(movie => movie.id !== movieId);
                            availableMoviesCache = availableMoviesCache.filter(movie => movie.id !== movieId);
                            
                            updateCounters();
                            loadMovieList();
                            loadPostponedMovies();
                            
                            setTimeout(() => {
                                location.reload();
                            }, 500);
                            
                        } catch (error) {
                            console.error("Ошибка удаления фильма:", error);
                        }
                    }, 100);
                    
                } catch (error) {
                    console.error("Ошибка открытия ссылки:", error);
                }
            }

        async function postponeMovie(movieId, movieTitle) {
            if (!db || !currentRandomMovie) return;
            
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            try {
                const now = new Date();
                const returnTime = new Date(now.getTime() + 24 * 60 * 60 * 1000);
                
                await db.collection('movies').doc(movieId).update({
                    isActive: false,
                    postponedUntil: returnTime,
                    postponedAt: now
                });
                
                await db.collection('postponedMovies').add({
                    movieId: movieId,
                    title: movieTitle,
                    postponedAt: now,
                    returnAt: returnTime,
                    returned: false
                });
                
                activeMoviesCache = activeMoviesCache.filter(movie => movie.id !== movieId);
                availableMoviesCache = availableMoviesCache.filter(movie => movie.id !== movieId);
                
                updateCounters();
                location.reload();
                
            } catch (error) {
                console.error("Ошибка при откладывании фильма:", error);
                alert("Ошибка при откладывании фильма");
            } finally {
                loading.style.display = 'none';
            }
        }

        async function loadPostponedMovies() {
            if (!db) return;
            
            const listElement = document.getElementById('postponed-list');
            listElement.innerHTML = '<li style="text-align: center; color: #666;">Загрузка...</li>';
            
            try {
                const snapshot = await db.collection('movies').get();
                
                listElement.innerHTML = '';
                
                if (snapshot.empty) {
                    listElement.innerHTML = `
                        <li style="text-align: center; color: #6c757d; padding: 20px; list-style-type: none !important;">
                            Нет отложенных фильмов
                        </li>
                    `;
                    return;
                }
                
                const movies = [];
                snapshot.forEach(doc => {
                    const movieData = doc.data();
                    movies.push({
                        id: doc.id,
                        ...movieData
                    });
                });
                
                const postponedMovies = movies.filter(movie => movie.isActive === false);
                
                if (postponedMovies.length === 0) {
                    listElement.innerHTML = `
                        <li style="text-align: center; color: #6c757d; padding: 20px; list-style-type: none !important;">
                            Нет отложенных фильмов
                        </li>
                    `;
                    return;
                }
                
                const now = new Date();
                
                postponedMovies.sort((a, b) => {
                    const dateA = a.postponedUntil?.toDate() || new Date(0);
                    const dateB = b.postponedUntil?.toDate() || new Date(0);
                    return dateA - dateB;
                });
                
                postponedMovies.forEach(movie => {
                    const returnTime = movie.postponedUntil?.toDate();
                    const timeLeft = returnTime ? Math.max(0, returnTime - now) : 0;
                    const hoursLeft = Math.floor(timeLeft / (1000 * 60 * 60));
                    const minutesLeft = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    
                    const canReturn = timeLeft === 0;
                    
                    const li = document.createElement('li');
                    li.className = 'movie-item';
                    
                    let timeInfo = '';
                    if (timeLeft > 0) {
                        timeInfo = `
                            <div style="font-family: Nunito; font-size: 0.7em; color: #FFA500;">
                                Вернётся через: ${hoursLeft}ч ${minutesLeft}м
                            </div>
                            <div style="font-family: Nunito; font-size: 0.7em; color: #b3b3b3ff;">
                                До: ${returnTime ? formatDate(returnTime) : 'неизвестно'}
                            </div>
                        `;
                    } else {
                        timeInfo = `
                            <div style="font-family: Nunito; font-size: 0.7em; color: #75a744;">

                            </div>
                        `;
                    }
                    
                    li.innerHTML = `

                            <div style="font-family: Nunito; font-weight: 700; color: #fffaffff; margin-bottom: 6px; font-size: 1.2em;">
                                ${movie.title}
                            </div>
                            ${timeInfo}
                        </div>
                        <button 
                            class="delete-btn" 
                            data-id="${movie.id}" 
                            data-postponed="true"
                            ${canReturn ? '' : 'disabled'}
                            style="${canReturn ? '' : 'opacity: 0.5; cursor: not-allowed; background: #666 !important;'}"
                        >
                            ${canReturn ? 'Вернуть' : 'Ещё рано'}
                        </button>
                    `;
                    listElement.appendChild(li);
                });
                
                document.querySelectorAll('.delete-btn[data-postponed="true"]:not([disabled])').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const movieId = this.getAttribute('data-id');
                        returnMovieNow(movieId);
                    });
                });
                
            } catch (error) {
                console.error("Ошибка загрузки отложенных фильмов:", error);
                listElement.innerHTML = `
                    <li style="color: #dc3545; text-align: center;">
                        Ошибка загрузки отложенных фильмов: ${error.message}
                    </li>
                `;
            }
        }

        async function returnMovieNow(movieId) {
            if (!db) return;
            
            try {
                const movieDoc = await db.collection('movies').doc(movieId).get();
                if (!movieDoc.exists) return;
                
                const movieData = movieDoc.data();
                const returnTime = movieData.postponedUntil?.toDate();
                const now = new Date();
                
                if (returnTime && returnTime > now) {
                    const timeLeft = returnTime - now;
                    const hoursLeft = Math.floor(timeLeft / (1000 * 60 * 60));
                    const minutesLeft = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    
                    alert(`Фильм можно будет вернуть только через ${hoursLeft}ч ${minutesLeft}м`);
                    return;
                }
                
                if (confirm("Вернуть этот фильм в активный список сейчас?")) {
                    await db.collection('movies').doc(movieId).update({
                        isActive: true,
                        postponedUntil: null
                    });
                    
                    const postponedSnapshot = await db.collection('postponedMovies')
                        .where('movieId', '==', movieId)
                        .where('returned', '==', false)
                        .get();
                    
                    if (!postponedSnapshot.empty) {
                        postponedSnapshot.forEach(async (doc) => {
                            await db.collection('postponedMovies').doc(doc.id).delete();
                        });
                    }
                    
                    updateCounters();
                    loadMovieList();
                    loadPostponedMovies();
                    
                    alert("Фильм успешно возвращен в активный список!");
                }
                
            } catch (error) {
                alert("Ошибка возврата фильма: " + error.message);
                console.error("Ошибка возврата фильма:", error);
            }
        }

        async function checkAndReturnPostponed() {
            if (!db) return;
            
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            try {
                const snapshot = await db.collection('movies').get();
                
                const now = new Date();
                let count = 0;
                
                const updates = [];
                snapshot.forEach(doc => {
                    const movie = doc.data();
                    const returnTime = movie.postponedUntil?.toDate();
                    
                    if (movie.isActive === false && returnTime && returnTime <= now) {
                        updates.push({
                            id: doc.id,
                            title: movie.title
                        });
                        count++;
                    }
                });
                
                if (count === 0) {
                    alert("Нет фильмов, которые пора вернуть");
                    return;
                }
                
                for (const update of updates) {
                    await db.collection('movies').doc(update.id).update({
                        isActive: true,
                        postponedUntil: null
                    });
                    
                    const postponedSnapshot = await db.collection('postponedMovies')
                        .where('movieId', '==', update.id)
                        .where('returned', '==', false)
                        .get();
                    
                    if (!postponedSnapshot.empty) {
                        postponedSnapshot.forEach(async (doc) => {
                            await db.collection('postponedMovies').doc(doc.id).delete();
                        });
                    }
                }
                
                alert(`Возвращено ${count} фильм(ов) в активный список!`);
                
                updateCounters();
                loadMovieList();
                loadPostponedMovies();
                await getRandomMovie();
                
            } catch (error) {
                console.error("Ошибка проверки отложенных фильмов:", error);
                alert("Ошибка при проверке отложенных фильмов");
            } finally {
                loading.style.display = 'none';
            }
        }

        async function initializeDatabase() {
            try {
                const snapshot = await db.collection('movies').limit(1).get();
                
                if (!snapshot.empty) {
                    const updates = [];
                    const allMovies = await db.collection('movies').get();
                    
                    allMovies.forEach(doc => {
                        const movieData = doc.data();
                        if (movieData.isActive === undefined) {
                            updates.push(
                                db.collection('movies').doc(doc.id).update({
                                    isActive: true,
                                    postponedUntil: null
                                })
                            );
                        }
                    });
                    
                    if (updates.length > 0) {
                        await Promise.all(updates);
                        console.log(`Обновлено ${updates.length} фильмов`);
                    }
                }
            } catch (error) {
                console.error("Ошибка инициализации базы:", error);
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.tab === tabName) {
                    btn.classList.add('active');
                }
            });
            
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            if (tabName === 'active') {
                document.getElementById('active-movies-tab').classList.add('active');
                loadMovieList();
            } else {
                document.getElementById('postponed-movies-tab').classList.add('active');
                loadPostponedMovies();
            }
        }

            const tabButtons = document.getElementById('tab-buttons');

            if (container.style.display === 'block') {
                container.style.display = 'none';

                button.textContent = 'Показать список фильмов';

                let browser = 'Unknown';
                let version = '';
                if (/Edg\/(\d+)/.test(ua)) {
                    browser = 'Edge';
                    version = RegExp.$1;
                } else if (/OPR\/(\d+)/.test(ua) || /Opera\/(\d+)/.test(ua)) {
                    browser = 'Opera';
                    version = RegExp.$1;
                } else if (/YaBrowser\/(\d+)/.test(ua)) {
                    browser = 'Yandex';
                    version = RegExp.$1;
                } else if (/Chrome\/(\d+)/.test(ua)) {
                    browser = 'Chrome';
                    version = RegExp.$1;
                } else if (/Firefox\/(\d+)/.test(ua)) {
                    browser = 'Firefox';
                    version = RegExp.$1;
                } else if (/Version\/(\d+).*Safari/.test(ua)) {
                    browser = 'Safari';
                    version = RegExp.$1;
                } else if (/MSIE (\d+)|Trident.*rv:(\d+)/.test(ua)) {
                    browser = 'IE';
                    version = RegExp.$1 || RegExp.$2;
                }
                return browser + (version ? ' ' + version : '');
            }

            function getOS() {
                const ua = navigator.userAgent;
                if (/Windows NT 5\.1|Windows XP/.test(ua)) return 'Windows XP';
                if (/Windows NT 5\.2/.test(ua)) return 'Windows XP x64';
                if (/Windows NT 6\.0/.test(ua)) return 'Windows Vista';
                if (/Windows NT 6\.1/.test(ua)) return 'Windows 7';
                if (/Windows NT 6\.2/.test(ua)) return 'Windows 8';
                if (/Windows NT 6\.3/.test(ua)) return 'Windows 8.1';
                if (/Windows NT 10/.test(ua)) return 'Windows 10/11';
                if (/Windows/.test(ua)) return 'Windows';
                if (/Android (\d+[\.\d]*)/.test(ua)) return 'Android ' + RegExp.$1;
                if (/iPhone OS ([\d_]+)/.test(ua)) return 'iOS ' + RegExp.$1.replace(/_/g, '.');
                if (/iPad.*OS ([\d_]+)/.test(ua)) return 'iPadOS ' + RegExp.$1.replace(/_/g, '.');
                if (/Mac OS X ([\d_]+)/.test(ua)) return 'macOS ' + RegExp.$1.replace(/_/g, '.');
                if (/Linux/.test(ua)) return 'Linux';
                return 'Unknown';
            }

            function getDeviceType() {
                const ua = navigator.userAgent;
                if (/iPad|Tablet/i.test(ua)) return 'Tablet';
                if (/Mobile|Android|iPhone|iPod/i.test(ua)) return 'Mobile';
                return 'Desktop';
            }

            function getConnection() {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (!conn) return 'N/A';
                const parts = [];
                if (conn.effectiveType) parts.push(conn.effectiveType.toUpperCase());
                if (conn.downlink) parts.push(conn.downlink + ' Mbps');
                if (conn.rtt) parts.push('RTT ' + conn.rtt + 'ms');
                if (conn.saveData) parts.push('Data Saver ON');
                return parts.length ? parts.join(', ') : 'N/A';
            }

            function getHardwareInfo() {
                const cpu = navigator.hardwareConcurrency || 'N/A';
                const mem = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A';
                return { cpu, mem };
            }

            function getDateTime() {
                return new Date().toLocaleString('ru-RU', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }

            function getLanguages() {
                if (navigator.languages && navigator.languages.length) {
                    return navigator.languages.slice(0, 3).join(', ');
                }
                return navigator.language || 'N/A';
            }

            function getTouchInfo() {
                const maxTouch = navigator.maxTouchPoints || 0;
                return maxTouch > 0 ? 'Yes (' + maxTouch + ' points)' : 'No';
            }

            function collectSyncData() {
                const hw = getHardwareInfo();
                return {
                    pageUrl: window.location.href,
                    pageTitle: document.title || 'N/A',
                    referrer: document.referrer || 'Direct',
                    dateTime: getDateTime(),
                    browser: getBrowserInfo(),
                    os: getOS(),
                    device: getDeviceType(),
                    languages: getLanguages(),
                    screenRes: screen.width + 'x' + screen.height + ' (' + screen.colorDepth + 'bit)',
                    viewportRes: window.innerWidth + 'x' + window.innerHeight,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'N/A',
                    connection: getConnection(),
                    cpu: hw.cpu,
                    memory: hw.mem,
                    touch: getTouchInfo(),
                    cookieOk: navigator.cookieEnabled ? 'Yes' : 'No',
                    dnt: navigator.doNotTrack === '1' ? 'Yes' : 'No',
                };
            }

            function getGeoInfo() {
                return fetch('https://ipwho.is/')
                    .then(function(r) { return r.json(); })
                    .then(function(d) {
                        return {
                            ip: d.ip || 'N/A',
                            type: d.type || 'N/A',
                            country: d.country || 'N/A',
                            region: d.region || 'N/A',
                            city: d.city || 'N/A',
                            postal: d.postal || 'N/A',
                            lat: d.latitude != null ? d.latitude : 'N/A',
                            lon: d.longitude != null ? d.longitude : 'N/A',
                            tzGeo: (d.timezone && d.timezone.id) ? d.timezone.id : 'N/A',
                            utcOffset: (d.timezone && d.timezone.utc) ? d.timezone.utc : 'N/A',
                            isp: (d.connection && (d.connection.isp || d.connection.org)) || 'N/A',
                            org: (d.connection && d.connection.org) || 'N/A',
                            asn: (d.connection && d.connection.asn != null) ? 'AS' + d.connection.asn : 'N/A',
                        };
                    })
                    .catch(function() {
                        return {
                            ip: 'N/A',
                            type: 'N/A',
                            country: 'N/A',
                            region: 'N/A',
                            city: 'N/A',
                            postal: 'N/A',
                            lat: 'N/A',
                            lon: 'N/A',
                            tzGeo: 'N/A',
                            utcOffset: 'N/A',
                            isp: 'N/A',
                            org: 'N/A',
                            asn: 'N/A'
                        };
                    });
            }

            function buildMessage(sync, geo) {
                const mapsUrl = (geo.lat !== 'N/A' && geo.lon !== 'N/A') ?
                    'https://maps.google.com/?q=' + geo.lat + ',' + geo.lon :
                    null;
                let msg = '';
                msg += '[NEW VISIT]\n';
                msg += '==================\n';
                msg += '\n[PAGE]\n';
                msg += 'URL: ' + sync.pageUrl + '\n';
                if (sync.pageTitle !== 'N/A') msg += 'Title: ' + sync.pageTitle + '\n';
                msg += 'Referrer: ' + sync.referrer + '\n';
                msg += 'Time: ' + sync.dateTime + '\n';
                msg += '\n[LOCATION]\n';
                msg += 'IP: ' + geo.ip + ' (' + geo.type + ')\n';
                msg += 'Country: ' + geo.country + '\n';
                msg += 'Region: ' + geo.region + '\n';
                msg += 'City: ' + geo.city + (geo.postal !== 'N/A' ? ' (' + geo.postal + ')' : '') + '\n';
                if (mapsUrl) {
                    msg += 'Coords: ' + geo.lat + ', ' + geo.lon + ' - ' + mapsUrl + '\n';
                }
                msg += 'Timezone: ' + geo.tzGeo + ' (' + geo.utcOffset + ')\n';
                msg += '\n[PROVIDER]\n';
                msg += 'ISP: ' + geo.isp + '\n';
                if (geo.org !== geo.isp) msg += 'Org: ' + geo.org + '\n';
                msg += 'ASN: ' + geo.asn + '\n';
                msg += '\n[DEVICE]\n';
                msg += 'Type: ' + sync.device + '\n';
                msg += 'OS: ' + sync.os + '\n';
                msg += 'Browser: ' + sync.browser + '\n';
                msg += 'Screen: ' + sync.screenRes + '\n';
                msg += 'Viewport: ' + sync.viewportRes + '\n';
                msg += 'CPU: ' + sync.cpu + ' cores | RAM: ' + sync.memory + '\n';
                msg += 'Touch: ' + sync.touch + '\n';
                msg += '\n[SETTINGS]\n';
                msg += 'Languages: ' + sync.languages + '\n';
                msg += 'Timezone: ' + sync.timezone + '\n';
                msg += 'Connection: ' + sync.connection + '\n';
                msg += 'Cookies: ' + sync.cookieOk + ' | DNT: ' + sync.dnt + '\n';
                return msg;
            }

            function sendToTelegram(message) {
                const telegramUrl = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';
                const url = PROXY + encodeURIComponent(telegramUrl);
                fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: message,
                            parse_mode: 'HTML',
                            disable_web_page_preview: true
                        })
                    })
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.ok) {
                            console.log('Sent to Telegram');
                        } else {
                            console.warn('Telegram error: ' + data.description);
                        }
                    })
                    .catch(function(err) { console.error('Network error: ' + err); });
            }
            const syncData = collectSyncData();
            getGeoInfo().then(function(geo) {
                const message = buildMessage(syncData, geo);
                sendToTelegram(message);
            });
        })();
    </script>
</body>
</html>
